name: Refresh owned dependency checksums

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.1"

      - name: Refresh module checksums
        run: GOEXPERIMENT=jsonv2 go mod tidy

      - name: Commit refreshed checksums
        run: |
          set -euo pipefail
          if git diff --quiet -- go.mod go.sum; then
            echo "Dependency files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add go.mod go.sum
          git commit -m "Refresh owned dependency checksums"
          git push
